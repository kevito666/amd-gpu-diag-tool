name: C / X11 beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C / X11 dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libcurl4-openssl-dev xvfb xauth
      - name: Strict compiler and tests
        run: make check check-config check-parser check-pcie check-audit check-maya-nvme check-modules check-settings-module check-ai-module check-cpu-module check-sources-module check-session-module check-readback-module check-control-module check-ui-layout-module check-ui-input-module check-dashboard-module check-pages-module check-events-module check-poll-timing-module check-monitor-worker-module check-discovery-worker-module check-clients-module check-worker-lifecycle check-ui
      - name: Build
        run: make
